[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "horizon_android"
crate-type = ["cdylib"]

[dependencies]
horizon-guest-stack = { path = "../horizon-guest-stack" }
horizon-client = { path = "../horizon-client", default-features = false, features = ["audio", "horizon-extras", "system-allocator"] }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index"] }
horizon-mod-host = { path = "../horizon-mod-host", default-features = false }
winit = { version = "0.30.13", features = ["android-native-activity"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
jni = "0.21.1"
libc = "0.2"
log = "0.4"

[lints]
workspace = true
